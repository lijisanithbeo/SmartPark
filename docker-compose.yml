version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartpark-db
    environment:
      POSTGRES_DB: SmartParkDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SmartPark2026!
    ports:
      - "5432:5432"
    volumes:
      - smartpark_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  smartpark_pgdata:
